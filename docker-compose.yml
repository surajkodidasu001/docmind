version: "3.9"
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - qdrant

  ui:
    build: .
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file: .env
    depends_on:
      - api

  react-ui:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    # the built app is a static bundle that reads VITE_API_BASE at build
    # time, not runtime — rebuild the image if the API's URL changes

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
